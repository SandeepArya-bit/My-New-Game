<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandeep's Birthday Wheel 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #e94560;
            margin-bottom: 5px;
            font-size: 26px;
            text-align: center;
        }

        p.subtitle {
            color: #4ecca3;
            margin-bottom: 25px;
            font-size: 15px;
            text-align: center;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff0000;
            z-index: 10;
        }

        #wheelCanvas {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }

        .spin-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background: #e94560;
            border: 4px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: 0.2s;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: #161623;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 2px solid #4ecca3;
            box-shadow: 0 0 25px rgba(78, 204, 163, 0.4);
        }

        .modal-content h2 {
            color: #e94560;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .modal-content p.dare-text {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            background: #0f3460;
            padding: 10px;
            border-radius: 8px;
        }

        .timer-msg {
            font-size: 14px;
            color: #ff9f43;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .close-btn {
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🎂 Sandeep's Birthday Wheel 🎂</h1>
    <p class="subtitle">Spin the wheel & complete the birthday task!</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="320" height="320"></canvas>
        <button class="spin-btn" id="spinBtn">SPIN</button>
    </div>

    <!-- Video Popup Modal -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>🎉 Your Birthday task! 🎉</h2>
            <p class="dare-text" id="dareResult">Loading...</p>
            
            <p class="timer-msg" id="timerMsg">⏳ And This is for you 😊 ...</p>
            
            <div class="video-container">
                <iframe id="ytVideo" src="" allow="autoplay" allowfullscreen></iframe>
            </div>

            <button class="close-btn" onclick="closeModal()">Spin Again 🔄</button>
        </div>
    </div>

    <script>
        // Aapki di gayi saari Shorts videos attach kar di gayi hain:
        const dares = [
            { text: "Wish Me Happy Birthday 🥳", videoId: "ne6ieqLoLfQ" },
            { text: "Send 1 Funny Pic with Me 😂", videoId: "fRUvwtdXa5U" },
            { text: "Treat Sandeep with a Pizza 🍕", videoId: "IEzabge7hEA" },
            { text: "Sing a Birthday Song for Me 🎤", videoId: "8Cyx_4mRBnc" },
            { text: "Send a Voice Note Wishing Me 🎙️", videoId: "IsYrgg-AY48" },
            { text: "Give Me a Secret Birthday Gift 🎁", videoId: "12PznPNWoWo" }
        ];

        const colors = ["#e94560", "#0f3460", "#4ecca3", "#ff9f43", "#10ac84", "#5f27cd"];

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");

        const numSlices = dares.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        let currentAngle = 0;
        let isSpinning = false;
        
        let countdownTimer;

        // Speech Synthesis Engine
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Draw Wheel Function
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            for (let i = 0; i < numSlices; i++) {
                const angle = currentAngle + i * sliceAngle;

                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
                ctx.lineTo(centerX, centerY);
                ctx.fill();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 11px sans-serif";
                ctx.textAlign = "right";
                ctx.fillText(dares[i].text.substring(0, 18) + "...", radius - 10, 4);
                ctx.restore();
            }
        }

        drawWheel();

        // Spin Functionality
        spinBtn.addEventListener("click", () => {
            if (isSpinning) return;
            isSpinning = true;

            const spinAngle = Math.floor(Math.random() * 360) + 1800; 
            const startAngle = currentAngle;
            const startTime = performance.now();
            const duration = 4000;

            function animateWheel(time) {
                const elapsed = time - startTime;
                if (elapsed < duration) {
                    const progress = elapsed / duration;
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    
                    currentAngle = startAngle + (spinAngle * (Math.PI / 180)) * easeOut;
                    drawWheel();
                    requestAnimationFrame(animateWheel);
                } else {
                    currentAngle = startAngle + (spinAngle * (Math.PI / 180));
                    drawWheel();
                    isSpinning = false;

                    const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
                    const pointerOffset = (1.5 * Math.PI) % (2 * Math.PI); 
                    const winningIndex = Math.floor(((normalizedAngle + pointerOffset) % (2 * Math.PI)) / sliceAngle);

                    showModal(dares[winningIndex]);
                }
            }

            requestAnimationFrame(animateWheel);
        });

        function showModal(winningTask) {
            document.getElementById("dareResult").innerText = winningTask.text;
            document.getElementById("ytVideo").src = "";
            document.getElementById("resultModal").style.display = "flex";

            clearInterval(countdownTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            // Clean Emoji from speech text
            const cleanTaskText = winningTask.text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
            speakText(`Your Birthday task is ${cleanTaskText}`);

            let timeLeft = 10;
            const timerMsg = document.getElementById("timerMsg");

            setTimeout(() => {
                timerMsg.innerText = `⏳ And This is for you 😊 ${timeLeft} seconds...`;
                speakText(timeLeft.toString());

                countdownTimer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        timerMsg.innerText = `⏳ And This is for you 😊 ${timeLeft} seconds...`;
                        speakText(timeLeft.toString());
                    } else {
                        clearInterval(countdownTimer);
                        timerMsg.innerText = "🍿 Enjoy the video now!";
                        
                        // YouTube Shorts Video URL Embed
                        const iframe = document.getElementById("ytVideo");
                        iframe.src = `https://www.youtube.com/embed/${winningTask.videoId}?autoplay=1`;
                    }
                }, 1000);
            }, 1800);
        }

        function closeModal() {
            clearInterval(countdownTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById("ytVideo").src = "";
            document.getElementById("resultModal").style.display = "none";
        }
    </script>
</body>
</html>
