<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandeep's Birthday Wheel 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #120129, #1a1a2e, #2b0938);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;    
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
            user-select: none; /* Text selection disable */
            -webkit-user-select: none;
        }

        .bg-animated-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-item {
            position: absolute;
            bottom: -50px;
            font-size: 30px;
            opacity: 0.75;
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        h1 {
            color: #ff4757;
            margin-bottom: 5px;
            font-size: 28px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.6);
            z-index: 2;
        }

        p.subtitle {
            color: #f3f3f6;
            margin-bottom: 25px;
            font-size: 16px;
            text-align: center;
            font-weight: 600;
            z-index: 2;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        #wheelCanvas {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.6), 0 0 10px rgba(46, 213, 115, 0.4);
        }

        .spin-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: 4px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.8);
            transition: 0.2s;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spin-btn:active { transform: scale(0.92); }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: #161623;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 2px solid #2ed573;
            box-shadow: 0 0 30px rgba(46, 213, 115, 0.4);
        }

        .modal-content h2 { color: #ff4757; font-size: 22px; margin-bottom: 8px; }
        .modal-content p.dare-text {
            color: #fff; font-size: 18px; font-weight: normal; margin-bottom: 15px;
            background: #0f3460; padding: 12px; border-radius: 8px; border: 1px solid #1e5395; line-height: 1.4;
        }
        .timer-msg { font-size: 15px; color: #ffa502; font-weight: bold; margin-bottom: 10px; }
        .video-container {
            position: relative; padding-bottom: 100%; height: 0; overflow: hidden;
            border-radius: 10px; margin-bottom: 15px; background: #000;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .close-btn {
            background: #2ed573; color: #1a1a2e; border: none; padding: 10px 22px;
            font-size: 15px; font-weight: bold; border-radius: 20px; cursor: pointer; transition: 0.2s;
        }
        .close-btn:hover { background: #26af5f; }
    </style>
</head>
<body>

    <div class="bg-animated-container">
        <div class="bg-item" style="left: 5%; animation-duration: 7s; animation-delay: 0s;">🎂</div>
        <div class="bg-item" style="left: 18%; animation-duration: 9s; animation-delay: 2s;">🌸</div>
        <div class="bg-item" style="left: 32%; animation-duration: 6s; animation-delay: 1s;">🌹</div>
        <div class="bg-item" style="left: 48%; animation-duration: 8s; animation-delay: 3s;">🎂</div>
        <div class="bg-item" style="left: 62%; animation-duration: 10s; animation-delay: 0.5s;">🌺</div>
        <div class="bg-item" style="left: 78%; animation-duration: 7s; animation-delay: 2.5s;">🍰</div>
        <div class="bg-item" style="left: 90%; animation-duration: 9s; animation-delay: 1.5s;">🌻</div>
    </div>

    <h1>🎂 Sandeep's Birthday Wheel 🎂</h1>
    <p class="subtitle"><b><i>Spin the wheel & complete the birthday task!👍</i></b></p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="320" height="320"></canvas>
        <button class="spin-btn" id="spinBtn">SPIN</button>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>🎉 Your Birthday Task! 🎉</h2>
            <p class="dare-text" id="dareResult">Loading...</p>
            <p class="timer-msg" id="timerMsg">⏳ Get Ready...</p>
            <div class="video-container">
                <iframe id="ytVideo" src="" allow="autoplay" allowfullscreen></iframe>
            </div>
            <button class="close-btn" onclick="closeModal()">Spin Again 🔄</button>
        </div>
    </div>

    <script>
        // ================= SECURITY PROTECTION LAYER ================= //
        
        // 1. Disable Right Click
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Disable Keyboard Shortcuts (F12, Ctrl+Shift+I/J/C, Ctrl+U, Ctrl+S)
        document.onkeydown = function (e) {
            if (e.keyCode == 123 || // F12
                (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || // Ctrl+Shift+I/J/C
                (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83)) // Ctrl+U (View Source) & Ctrl+S
            ) {
                return false;
            }
        };

        // 3. Anti-Debugger Loop (Freezes DevTools if opened)
        setInterval(function () {
            (function () {
                function block() {
                    try {
                        (function (a) {
                            return (function (a) {
                                return (Function('Function(arguments[0])("debugger")()'))();
                            })(a);
                        })(this);
                    } catch (e) {}
                }
                block();
            })();
        }, 100);

        // ================= ORIGINAL APP LOGIC ================= //
        
        const dares = [
            { text: "Wish Sandeep,<br><b>Happy Birthday</b> 🥳", videoId: "oTY84sjtoOs" },
            { text: "Send 1 Funny Pic <br> with <b>Sandeep</b> 😂", videoId: "fRUvwtdXa5U" },
            { text: "Treat Sandeep with a Pizza 🍕", videoId: "ne6ieqLoLfQ" },
            { text: "Sing a Birthday Song for Sandeep 🎤", videoId: "8Cyx_4mRBnc" },
            { text: "Send a Voice Note Wishing Sandeep 🎙️", videoId: "EROeN_I_oG8" },
            { text: "Give Sandeep a Secret Birthday Gift 🎁", videoId: "12PznPNWoWo" }
        ];

        const colors = ["#ff4757", "#0f3460", "#2ed573", "#ffa502", "#1e90ff", "#9b59b6"];

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");

        const numSlices = dares.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        let currentAngle = 0;
        let isSpinning = false;
        
        let selectedFemaleVoice = null;
        let isModalActive = false;

        function initVoices() {
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                selectedFemaleVoice = voices.find(v => 
                    (v.lang.includes('en') || v.lang.includes('hi')) && 
                    (v.name.toLowerCase().includes('female') || 
                     v.name.toLowerCase().includes('zira') || 
                     v.name.toLowerCase().includes('samantha') || 
                     v.name.toLowerCase().includes('google uk english female'))
                ) || null;
            }
        }

        if ('speechSynthesis' in window) {
            initVoices();
            window.speechSynthesis.onvoiceschanged = initVoices;
        }

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            for (let i = 0; i < numSlices; i++) {
                const angle = currentAngle + i * sliceAngle;

                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
                ctx.lineTo(centerX, centerY);
                ctx.fill();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 11px sans-serif";
                ctx.textAlign = "right";
                
                const cleanWheelLabel = dares[i].text.replace(/<[^>]*>/g, '').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
                ctx.fillText(cleanWheelLabel.substring(0, 18) + "...", radius - 10, 4);
                ctx.restore();
            }
        }

        drawWheel();

        spinBtn.addEventListener("click", () => {
            if (isSpinning) return;
            isSpinning = true;

            const spinAngle = Math.floor(Math.random() * 360) + 1800; 
            const startAngle = currentAngle;
            const startTime = performance.now();
            const duration = 4000;

            function animateWheel(time) {
                const elapsed = time - startTime;
                if (elapsed < duration) {
                    const progress = elapsed / duration;
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    
                    currentAngle = startAngle + (spinAngle * (Math.PI / 180)) * easeOut;
                    drawWheel();
                    requestAnimationFrame(animateWheel);
                } else {
                    currentAngle = startAngle + (spinAngle * (Math.PI / 180));
                    drawWheel();
                    isSpinning = false;

                    const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
                    const pointerOffset = (1.5 * Math.PI) % (2 * Math.PI); 
                    const winningIndex = Math.floor(((normalizedAngle + pointerOffset) % (2 * Math.PI)) / sliceAngle);

                    showModal(dares[winningIndex]);
                }
            }

            requestAnimationFrame(animateWheel);
        });

        function speakPhrase(text) {
            return new Promise((resolve) => {
                if (!isModalActive) return resolve();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 1.15;
                utterance.volume = 1.0;
                utterance.pitch = 1.15;
                if (selectedFemaleVoice) utterance.voice = selectedFemaleVoice;

                utterance.onend = () => resolve();
                utterance.onerror = () => resolve();
                
                window.speechSynthesis.speak(utterance);
            });
        }

        function speakNumberEventSynced(numText) {
            return new Promise((resolve) => {
                if (!isModalActive) return resolve();

                const utterance = new SpeechSynthesisUtterance(numText);
                utterance.lang = 'en-US';
                utterance.rate = 2.0;
                utterance.volume = 1.0;
                utterance.pitch = 1.15;
                if (selectedFemaleVoice) utterance.voice = selectedFemaleVoice;

                utterance.onstart = () => {
                    const timerMsg = document.getElementById("timerMsg");
                    timerMsg.innerText = `⏳ And This is for you 😊 ${numText} seconds...`;
                };

                utterance.onend = () => resolve();
                utterance.onerror = () => resolve();

                window.speechSynthesis.speak(utterance);
            });
        }

        async function showModal(winningTask) {
            isModalActive = true;
            document.getElementById("dareResult").innerHTML = winningTask.text;
            document.getElementById("ytVideo").src = "";
            document.getElementById("resultModal").style.display = "flex";

            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            const cleanTaskText = winningTask.text.replace(/<[^>]*>/g, '').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
            const timerMsg = document.getElementById("timerMsg");
            timerMsg.innerText = "🗣️ Listening Task...";

            await speakPhrase(`Your Birthday task is, ${cleanTaskText}`);
            await speakPhrase("And this song for you, let's start");

            for (let num = 3; num >= 1; num--) {
                if (!isModalActive) break;
                await speakNumberEventSynced(num.toString());
            }

            if (isModalActive) {
                timerMsg.innerText = "🍿 Enjoy the video now!";
                const iframe = document.getElementById("ytVideo");
                iframe.src = `https://www.youtube.com/embed/${winningTask.videoId}?autoplay=1`;
            }
        }

        function closeModal() {
            isModalActive = false;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById("ytVideo").src = "";
            document.getElementById("resultModal").style.display = "none";
        }
    </script>
</body>
</html>
